name: Deploy Frontend to Production Cloud Run

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    # GitHub Environment Variables에 값을 넣어둔 경우 필요함.
    # Repository Variables에만 넣어둔 경우 없어도 되지만, 둬도 문제 없음.
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID_PROD }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION_PROD }}
      ARTIFACT_REGISTRY_REGION: ${{ vars.ARTIFACT_REGISTRY_REGION_PROD }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY_PROD }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME_PROD }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE_PROD }}

      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL_PROD }}
      NEXT_PUBLIC_ATTENDANCE_TARGET_LATITUDE: ${{ vars.NEXT_PUBLIC_ATTENDANCE_TARGET_LATITUDE_PROD }}
      NEXT_PUBLIC_ATTENDANCE_TARGET_LONGITUDE: ${{ vars.NEXT_PUBLIC_ATTENDANCE_TARGET_LONGITUDE_PROD }}
      NEXT_PUBLIC_ATTENDANCE_TARGET_RADIUS_METERS: ${{ vars.NEXT_PUBLIC_ATTENDANCE_TARGET_RADIUS_METERS_PROD }}
      NEXT_PUBLIC_ATTENDANCE_TARGET_LABEL: ${{ vars.NEXT_PUBLIC_ATTENDANCE_TARGET_LABEL_PROD }}
      NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_FILE_API_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_FILE_API_URL_PROD }}
      NEXT_PUBLIC_DEPLOY_TARGET: PROD
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
      KEEP_COUNT: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_PROD }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev --quiet

      - name: Debug public env
        run: |
          echo "PROJECT_ID=${{ env.PROJECT_ID }}"
          echo "CLOUD_RUN_REGION=${{ env.CLOUD_RUN_REGION }}"
          echo "ARTIFACT_REGISTRY_REGION=${{ env.ARTIFACT_REGISTRY_REGION }}"
          echo "AR_REPOSITORY=${{ env.AR_REPOSITORY }}"
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}"
          echo "CLOUD_RUN_SERVICE=${{ env.CLOUD_RUN_SERVICE }}"
          echo "NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}"
          echo "NEXT_PUBLIC_ATTENDANCE_TARGET_LATITUDE=${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_LATITUDE }}"
          echo "NEXT_PUBLIC_ATTENDANCE_TARGET_LONGITUDE=${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_LONGITUDE }}"
          echo "NEXT_PUBLIC_ATTENDANCE_TARGET_RADIUS_METERS=${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_RADIUS_METERS }}"
          echo "NEXT_PUBLIC_ATTENDANCE_TARGET_LABEL=${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_LABEL }}"
          echo "NEXT_PUBLIC_DEPLOY_TARGET=${{ env.NEXT_PUBLIC_DEPLOY_TARGET }}"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ env.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_ATTENDANCE_TARGET_LATITUDE="${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_LATITUDE }}" \
            --build-arg NEXT_PUBLIC_ATTENDANCE_TARGET_LONGITUDE="${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_LONGITUDE }}" \
            --build-arg NEXT_PUBLIC_ATTENDANCE_TARGET_RADIUS_METERS="${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_RADIUS_METERS }}" \
            --build-arg NEXT_PUBLIC_ATTENDANCE_TARGET_LABEL="${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_LABEL }}" \
            --build-arg NEXT_PUBLIC_DEPLOY_TARGET="${{ env.NEXT_PUBLIC_DEPLOY_TARGET }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_FILE_API_URL="${{ env.NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_FILE_API_URL }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_VAPID_KEY="${{ env.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}" \
            -t ${{ env.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.CLOUD_RUN_REGION }}
          image: ${{ env.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Show deployed URL
        run: echo "${{ steps.deploy.outputs.url }}"

      - name: Cleanup old Artifact Registry images
        run: |
          IMAGE_BASE="${{ env.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}"

          echo "Keeping latest ${{ env.KEEP_COUNT }} image digests in $IMAGE_BASE"

          gcloud artifacts docker images list "$IMAGE_BASE" \
            --project="${{ env.PROJECT_ID }}" \
            --include-tags \
            --sort-by=~UPDATE_TIME \
            --format="value(DIGEST)" \
            | awk 'NF && !seen[$0]++' \
            | tail -n +$((${{ env.KEEP_COUNT }} + 1)) \
            | while read DIGEST; do
                if [ -n "$DIGEST" ]; then
                  echo "Deleting old image digest: $DIGEST"
                  gcloud artifacts docker images delete "$IMAGE_BASE@$DIGEST" \
                    --project="${{ env.PROJECT_ID }}" \
                    --delete-tags \
                    --quiet || true
                fi
              done

      - name: Cleanup old Cloud Run revisions
        run: |
          echo "Keeping latest ${{ env.KEEP_COUNT }} Cloud Run revisions for ${{ env.CLOUD_RUN_SERVICE }}"

          gcloud run revisions list \
            --project="${{ env.PROJECT_ID }}" \
            --service="${{ env.CLOUD_RUN_SERVICE }}" \
            --region="${{ env.CLOUD_RUN_REGION }}" \
            --sort-by=~metadata.creationTimestamp \
            --format="value(metadata.name)" \
            | tail -n +$((${{ env.KEEP_COUNT }} + 1)) \
            | while read REVISION; do
                if [ -n "$REVISION" ]; then
                  echo "Deleting old revision: $REVISION"
                  gcloud run revisions delete "$REVISION" \
                    --project="${{ env.PROJECT_ID }}" \
                    --region="${{ env.CLOUD_RUN_REGION }}" \
                    --quiet || true
                fi
              done
